<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0c0e14" rx="16"/>
  <text x="40" y="50" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">Nepo Baby Magazine: Blender 3D Coupe Integration</text>
  <text x="40" y="75" fill="#8e95a0" font-family="monospace" font-size="12">Multi-plane canvas compositing with procedural lighting</text>
  
  <g transform="translate(60, 120)">
    <rect width="680" height="70" fill="#141720" stroke="#bdff52" rx="8"/>
    <text x="20" y="42" fill="#bdff52" font-family="sans-serif" font-size="14" font-weight="bold">Layer 1: DOM Editorial Content &amp; Marquee Strips</text>
  </g>
  
  <g transform="translate(60, 210)">
    <rect width="680" height="110" fill="#181c26" stroke="#5ce1e6" rx="8"/>
    <text x="20" y="35" fill="#5ce1e6" font-family="sans-serif" font-size="14" font-weight="bold">Layer 2: Fixed 3D WebGL Canvas (Stage)</text>
    <text x="20" y="65" fill="#ced4da" font-family="monospace" font-size="12">Blender Procedural Coupe Model // Turntable LookAt Controller</text>
    <text x="20" y="90" fill="#8e95a0" font-family="monospace" font-size="11">pointer-events: none (transparent passthrough with depth-buffer retention)</text>
  </g>
  
  <g transform="translate(60, 340)">
    <rect width="680" height="70" fill="#141720" stroke="#cf005e" rx="8"/>
    <text x="20" y="42" fill="#cf005e" font-family="sans-serif" font-size="14" font-weight="bold">Layer 3: Background Chromatic Gradient Substrate</text>
  </g>
</svg>
