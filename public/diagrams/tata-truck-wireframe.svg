<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0c0e14" rx="16"/>
  <text x="40" y="50" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">Tata Truck Cabin Simulator: Web Audio Synthesis Graph</text>
  <text x="40" y="75" fill="#8e95a0" font-family="monospace" font-size="12">Procedural Engine Harmonics &amp; Horn Synthesis (Zero MP3s)</text>
  
  <g transform="translate(40, 110)">
    <rect width="210" height="150" fill="#141720" stroke="#f4a228" rx="8"/>
    <text x="20" y="30" fill="#f4a228" font-family="sans-serif" font-size="14" font-weight="bold">Engine Oscillator Node</text>
    <text x="20" y="60" fill="#ced4da" font-family="monospace" font-size="11">Type: Sawtooth (120Hz)</text>
    <text x="20" y="85" fill="#adb5bd" font-family="monospace" font-size="11">Throttle Input [W]</text>
    <text x="20" y="110" fill="#bdff52" font-family="monospace" font-size="11">Modulation: 120Hz -&gt; 480Hz</text>
  </g>
  
  <g transform="translate(40, 290)">
    <rect width="210" height="150" fill="#141720" stroke="#5ce1e6" rx="8"/>
    <text x="20" y="30" fill="#5ce1e6" font-family="sans-serif" font-size="14" font-weight="bold">Air Horn Dual Dual-Synth</text>
    <text x="20" y="60" fill="#ced4da" font-family="monospace" font-size="11">Osc A: Square 340Hz</text>
    <text x="20" y="85" fill="#ced4da" font-family="monospace" font-size="11">Osc B: Square 440Hz</text>
    <text x="20" y="110" fill="#adb5bd" font-family="monospace" font-size="11">Detune: +15 Cents</text>
  </g>
  
  <path d="M 270 185 L 340 185" stroke="#f4a228" stroke-width="2"/>
  <path d="M 270 365 L 340 365" stroke="#5ce1e6" stroke-width="2"/>
  
  <g transform="translate(360, 110)">
    <rect width="210" height="330" fill="#141720" stroke="#2a3040" rx="8"/>
    <text x="20" y="35" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">Biquad Filter &amp; Gain</text>
    <rect x="20" y="60" width="170" height="80" fill="#1f2838" rx="6"/>
    <text x="30" y="90" fill="#ced4da" font-family="monospace" font-size="11">Cabin Resonator</text>
    <text x="30" y="115" fill="#adb5bd" font-family="monospace" font-size="10">Lowpass 800Hz / Q: 3.5</text>
    
    <rect x="20" y="160" width="170" height="80" fill="#1f2838" rx="6"/>
    <text x="30" y="190" fill="#ced4da" font-family="monospace" font-size="11">Reverb Convolver</text>
    <text x="30" y="215" fill="#adb5bd" font-family="monospace" font-size="10">Highway Ambience</text>
    
    <rect x="20" y="260" width="170" height="50" fill="#1f2838" rx="6"/>
    <text x="30" y="290" fill="#bdff52" font-family="monospace" font-size="11">Master Gain Node</text>
  </g>
  
  <path d="M 590 275 L 650 275" stroke="#bdff52" stroke-width="2"/>
  
  <g transform="translate(660, 200)">
    <circle cx="50" cy="75" r="45" fill="#141720" stroke="#bdff52" stroke-width="2"/>
    <text x="25" y="70" fill="#bdff52" font-family="sans-serif" font-size="11" font-weight="bold">Audio</text>
    <text x="18" y="90" fill="#bdff52" font-family="sans-serif" font-size="11" font-weight="bold">Context</text>
  </g>
</svg>
