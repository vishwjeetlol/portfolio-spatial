<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Studies // 3 Kinetic Algorithms in Code</title>
  <style>
    :root {
      --bg: #07080c;
      --surface: rgba(18, 21, 31, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f3f5;
      --muted: #8e95a0;
      --accent: #5ce1e6;
      --accent-magenta: #cf005e;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(207, 0, 94, 0.15);
      color: var(--accent-magenta);
      border: 1px solid rgba(207, 0, 94, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
    }

    /* Study Nav Tabs */
    .study-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .study-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 9999px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 150ms ease;
    }
    .study-tab:hover { color: #fff; }
    .study-tab.active {
      background: #fff;
      color: #000;
      font-weight: bold;
      border-color: #fff;
    }

    /* Stage Canvas */
    .stage-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD overlay */
    .hud-caption {
      position: absolute;
      bottom: 24px;
      left: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 12px 18px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text);
      z-index: 10;
      max-width: 420px;
    }
    .hud-caption strong { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Motion Studies // Kinetic Algorithms</h1>
      <span style="font-size: 0.8rem; color: var(--muted);">Algorithmic Motion, Particle Morphing &amp; Spatial Transforms</span>
    </div>
    <span class="badge">Self-initiated project</span>
  </header>

  <nav class="study-tabs">
    <button class="study-tab active" data-study="0">Study 1: Kinetic Wave Typography</button>
    <button class="study-tab" data-study="1">Study 2: Particle-Text Morph</button>
    <button class="study-tab" data-study="2">Study 3: 3D Origami Prism Unfold</button>
  </nav>

  <div class="stage-container">
    <canvas id="motion-canvas"></canvas>
    <div class="hud-caption" id="hud-caption">
      <strong>Study 1: Kinetic Wave Typography</strong><br>
      Continuous sinusoidal character baseline modulation &amp; harmonic scale displacement.
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
